name: Deploy to Railway
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Copy out to deploy-temp
        run: cp -r out deploy-temp/

      - name: Deploy to Railway
        run: npx @railway/cli up --detach --ci -p 7943590d-78b1-4471-8582-5c29588e7dc5 -s 98d4bf35-9e13-4af7-b361-5a6c7fda4d4c
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        working-directory: deploy-temp
