services:
  - type: web
    name: oasis-portfolio
    runtime: python
    repo: https://github.com/b8439978-create/oasis-portfolio
    branch: master
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: ADMIN_PASSWORD
        value: oasis123
      - key: SECRET_KEY
        generateValue: true
