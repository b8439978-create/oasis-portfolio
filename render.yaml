services:
  - type: web
    name: oasis-portfolio
    runtime: python
    repo: https://github.com/b8439978-create/oasis-portfolio
    branch: master
    plan: free
    buildCommand: npm install && npm run build && pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn server:app --worker-class sync --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: ADMIN_PASSWORD
        value: oasis123
      - key: SECRET_KEY
        generateValue: true
